services:
  db:
    image: postgres:16-alpine
    container_name: autonomous_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autonomous_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autonomous_ops_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/autonomous_ops
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_ENGINE_TIMEOUT_SECONDS=15.0
      - AVERAGE_SPEED_KMH=30.0
      - HOST=0.0.0.0
      - PORT=5000
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-engine:
    image: python:3.11-slim
    container_name: autonomous_ops_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install fastapi uvicorn && python -c \"
      import uvicorn
      from fastapi import FastAPI
      app = FastAPI()
      @app.get('/health')
      def h(): return {'status': 'healthy'}
      @app.post('/autonomous-operation')
      def op(req: dict):
          return {
              'failure_probability': 0.88,
              'asset_risk': 'HIGH',
              'RUL': 42.5,
              'recommended_action': 'REPLACE_BEARING',
              'stock_status': 'CRITICAL_LOW',
              'reorder_quantity': 5,
              'preventive_cost': 750.0,
              'failure_cost': 8500.0,
              'estimated_savings': 7750.0,
              'required_skills': ['HVAC_CERTIFIED', 'BEARING_OVERHAUL'],
              'required_parts': ['PART-BRG-7701'],
              'priority': 'HIGH',
              'autonomous_decision': 'SCHEDULE_IMMEDIATE_DISPATCH'
          }
      uvicorn.run(app, host='0.0.0.0', port=8000)
      \""
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
